name: AklimaGeldi

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: tr
  knownRegions:
    - Base
    - tr
    - en
    - es

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PTQ5FN6P8U
    ENABLE_HARDENED_RUNTIME: NO

targets:
  AklimaGeldi:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abim.aklimageldi
        PRODUCT_NAME: daakREMEMBER
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/AklimaGeldi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: AklimaGeldiWidget
        embed: true
      - package: Sparkle

  AklimaGeldiWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetSources
      - path: Sources/MemoryItem.swift
      - path: Sources/SharedStorage.swift
      - path: Resources
        buildPhase: resources
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: daakREMEMBER Widget
        CFBundleShortVersionString: 0.3.0
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AklimaGeldiAppGroup: $(DEVELOPMENT_TEAM).group.dev.abim.aklimageldi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.abim.aklimageldi.widget
        PRODUCT_NAME: AklimaGeldiWidget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Config/AklimaGeldiWidget.entitlements
